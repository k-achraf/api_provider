name: easy_api_provider
description: "Flutter Dio API client with automatic state management, error handling, request logging, file downloads, and reactive UI widgets."
version: 2.4.0
homepage: https://github.com/k-achraf/api_provider
repository: https://github.com/k-achraf/api_provider
issue_tracker: https://github.com/k-achraf/api_provider/issues
documentation: https://github.com/k-achraf/api_provider#readme
license: MIT

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.2
  talker_dio_logger: ^5.1.17
  ansicolor: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4

topics:
  - api
  - http
  - dio
  - network
  - request

funding:
  - https://github.com/sponsors/k-achraf

screenshots:
  - description: "ApiProviderUi widget switching between loading, success, error, and empty states"
    path: screenshots/api_states_preview.png

